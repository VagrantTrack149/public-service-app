services:
  db:
    image: mysql:latest
    container_name: mi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Hola_BD_PRUEBA24 #pass and usr
      MYSQL_DATABASE: Mapas
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mi-pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db #server
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
volumes:
  db_data: 

