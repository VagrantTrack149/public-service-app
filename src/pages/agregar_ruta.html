<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar ruta — RutaMX</title>
  <script>
    (function () {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css">
  <link rel="stylesheet" href="../styles/output.css">
</head>
<body class="min-h-screen overflow-hidden">

  <div id="header-container"></div>
  <script>
    fetch('/header.html').then(r => r.text()).then(d => {
      document.getElementById('header-container').innerHTML = d;
      window.dispatchEvent(new Event('header:loaded'));
    });
  </script>
  <script src="/js/header.js" defer></script>

  <div id="map" class="fixed inset-0 z-0 pt-16"></div>

  <div class="fixed top-20 left-4 z-[500] w-[22rem] max-w-[calc(100vw-2rem)]">
    <div class="surface p-4 max-h-[calc(100vh-6rem)] overflow-y-auto">
      <h2 class="font-bold text-lg mb-1">Nueva ruta</h2>
      <p class="text-xs text-muted mb-3">Haz clic en el mapa para añadir paradas en orden.</p>

      <label class="label" for="estados">Estado</label>
      <select id="estados" class="select mb-3"><option value="">Seleccione un estado</option></select>

      <label class="label" for="municipios">Municipio</label>
      <select id="municipios" class="select mb-3"><option value="">Seleccione un municipio</option></select>

      <label class="label" for="nombre_parada">Nombre de la ruta</label>
      <input type="text" id="nombre_parada" placeholder="Ruta X" class="input mb-3">

      <label class="label" for="descripcion_parada">Descripción</label>
      <textarea id="descripcion_parada" rows="3" placeholder="Describe la ruta…"
                class="textarea mb-3"></textarea>

      <input type="text" hidden id="paradas" name="paradas">
      <div hidden>
        <input type="text" id="lat"><input type="text" id="lng">
      </div>

      <div class="flex gap-2 mb-4">
        <button type="button" onclick="Guardar_ruta()" class="btn btn-primary flex-1">Guardar</button>
        <button type="button" onclick="Descargar_Ruta()" class="btn btn-outline flex-1">Descargar</button>
      </div>

      <h3 class="font-bold text-sm mb-2">Paradas</h3>
      <ul id="lista_paradas" class="text-xs space-y-1"></ul>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script type="module" src="../js/lectura_rutas.js"></script>
</body>
</html>
