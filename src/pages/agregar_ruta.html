<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Ruta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../styles/output.css">
</head>
<body>
    <div id="controles" class="left-0 top-0 w-1/4 h-full overflow-y-auto">
        <div class="absolute top-10 left-0 bg-white p-4 rounded shadow-lg w-1/5">
            <select name="estados" id="estados" class="mb-2 w-full">
                <option value="">Seleccione un estado</option>
            </select>
            <select name="municipios" id="municipios" class="mb-2 w-full">
                <option value="">Seleccione un municipio</option>
            </select>
            <label for="nombre_parada">Nombre de la ruta</label>
            <input type="text" id="nombre_parada" name="nombre_parada" placeholder="Ruta X" class="mb-2 w-full">
            <label for="descripcion_parada">Descripción de la ruta</label>
            <input type="text" id="descripcion_parada" name="descripcion_parada" placeholder="Descripción de la ruta" class="mb-2 w-full h-28">
            <input type="text" hidden id="paradas" name="paradas">
            <button type="button" onclick="Guardar_ruta()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mb-2 w-full">Guardar Ruta</button>
            <button type="button" onclick="Descargar_Ruta()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">Descargar ruta</button>
            <ul id="lista_paradas" class="mt-4">Paradas:</ul>
            <div hidden>
                <label for="lat">Latitud</label><input type="text" name="lat" id="lat">
                <label for="lng">Longitud</label><input type="text" name="lng" id="lng">
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script type="module" src="../js/lectura_rutas.js"></script>
</body>
</html>
