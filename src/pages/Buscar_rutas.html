<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar rutas — RutaMX</title>
  <script>
    (function () {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css">
  <link rel="stylesheet" href="../styles/output.css">
</head>
<body class="min-h-screen overflow-hidden">

  <div id="header-container"></div>
  <script>
    fetch('/header.html').then(r => r.text()).then(d => {
      document.getElementById('header-container').innerHTML = d;
      window.dispatchEvent(new Event('header:loaded'));
    });
  </script>
  <script src="/js/header.js" defer></script>

  <!-- Mapa a pantalla completa -->
  <div id="map" class="fixed inset-0 z-0 pt-16"></div>

  <!-- Panel de búsqueda -->
  <div class="fixed top-20 left-4 z-[500] w-[19rem] max-w-[calc(100vw-2rem)]">
    <div class="surface p-4">
      <h2 class="font-bold text-lg mb-3">Buscar rutas</h2>

      <label class="label" for="estados">Estado</label>
      <select id="estados" class="select mb-3">
        <option value="">Seleccione un estado</option>
      </select>

      <label class="label" for="municipios">Municipio</label>
      <select id="municipios" class="select mb-3">
        <option value="">Seleccione un municipio</option>
      </select>
      <input type="text" hidden id="nombre_parada" name="paradas" >
      <button onclick="buscarRutas()" class="btn btn-primary w-full mb-3">
        Buscar rutas en la zona
      </button>

      <label class="label" for="ruta">Cargar ruta desde archivo</label>
      <input type="file" id="ruta" onchange="leerRuta()" accept=".json" class="file-input">

      <div hidden>
        <input type="text" id="lat" name="lat">
        <input type="text" id="lng" name="lng">
      </div>
    </div>

    <!-- Lista de rutas encontradas -->
    <div id="in_rutas" class="surface mt-3 p-4 max-h-[50vh] overflow-y-auto">
      <h3 class="font-bold text-sm mb-2 flex items-center gap-2">
        Rutas encontradas
        <span id="rutas-count" class="text-xs px-2 py-0.5 rounded-full"
              style="background-color: rgb(var(--c-primary-soft)); color: rgb(var(--c-primary));">0</span>
      </h3>
      <div id="rutas_encontradas" class="text-sm"></div>
    </div>
  </div>
  <script>
    nombre_parada=document.getElementById("nombre_parada");
    nombre_parada.addEventListener("onchange", function() {
      nombre_parada.hidden=false;
    });
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script type="module" src="../js/lectura_rutas.js"></script>
</body>
</html>
