<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar rutas de transporte público en tu zona</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles/output.css">
    
</head>
<body>
    <div id="controles" class=" left-0 top-0 w-1/4 h-full overflow-y-auto">
        <div class="absolute top-10 left-0 bg-white p-4 rounded shadow-lg w-1/5">
            <select name="estados" id="estados" class="mb-2 w-full">
                <option value="" class="w-full">Seleccione un estado </option>
            </select>
            <select name="municipios" id="municipios" class="mb-2 w-full">
                <option value="" class="w-full">Seleccione un municipio </option>
            </select>
            <script>
                estado=document.getElementById('estados');
                municipio=document.getElementById('municipios');
            </script>
            <button onclick="buscarRutas(estado,municipio)" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded p-2">Buscar Rutas en la zona</button>
            <br>
            <label for="ruta">Cargar una ruta localmente
                <input type="file" name="ruta" id="ruta" onchange="leerRuta()">
            </label>
            <div hidden><label for="lat">Latitude</label><input type="text" name="lat" id="lat"></div>
            <div hidden><label for="lng">Longitude</label><input type="text" name="lng" id="lng"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./js/map.js"></script>
    <script type="module" src="./js/lectura_rutas.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    
</body>
</html>
