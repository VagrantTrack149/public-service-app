<nav id="app-header"
     class="fixed top-0 left-0 w-full z-50 backdrop-blur-md"
     style="background-color: rgb(var(--c-bg) / .85); border-bottom: 1px solid rgb(var(--c-border));">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex justify-between items-center h-16">

      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 shrink-0">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center"
             style="background-color: rgb(var(--c-primary)); color: rgb(var(--c-primary-fg));">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               class="w-5 h-5">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight">
          Ruta<span style="color: rgb(var(--c-primary));">MX</span>
        </span>
      </a>

      <!-- Nav desktop -->
      <div class="hidden md:flex items-center gap-1">
        <a href="/" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-[rgb(var(--c-bg-alt))]">Inicio</a>
        <a href="/Buscar_rutas" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-[rgb(var(--c-bg-alt))]">Buscar rutas</a>
        <a href="/Agregar_rutas" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-[rgb(var(--c-bg-alt))]">Agregar ruta</a>
      </div>

      <!-- Acciones derecha -->
      <div class="flex items-center gap-2">
        <!-- Toggle tema -->
        <button id="theme-toggle" class="btn btn-ghost p-2" aria-label="Cambiar tema" title="Cambiar tema">
          <svg class="w-5 h-5 hidden dark:block" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="w-5 h-5 block dark:hidden" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <!-- Área de usuario  -->
        <div id="auth-area" class="hidden md:flex items-center gap-2"></div>

        <!-- Botón menú móvil -->
        <button id="menu-btn" class="btn btn-ghost p-2 md:hidden" aria-label="Abrir menú">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Menú móvil -->
  <div id="mobile-menu" class="hidden md:hidden border-t"
       style="border-color: rgb(var(--c-border)); background-color: rgb(var(--c-bg-elev));">
    <a href="/" class="block px-6 py-3 hover:bg-[rgb(var(--c-bg-alt))]">Inicio</a>
    <a href="/Buscar_rutas" class="block px-6 py-3 hover:bg-[rgb(var(--c-bg-alt))]">Buscar rutas</a>
    <a href="/Agregar_rutas" class="block px-6 py-3 hover:bg-[rgb(var(--c-bg-alt))]">Agregar ruta</a>
    <div id="auth-area-mobile" class="px-6 py-3 border-t" style="border-color: rgb(var(--c-border));"></div>
  </div>
</nav>
